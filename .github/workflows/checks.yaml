on: pull_request

env:
  # ideally this shouldn't be needed because we have a .swift-version file.
  # see https://github.com/swiftlang/swiftly/issues/517
  swift_version: "6.2.4"

jobs:
  static_checks:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: vapor/swiftly-action@v0.2.1
        with:
            toolchain: ${{ env.swift_version }}
      - run: swift format lint --recursive --strict .